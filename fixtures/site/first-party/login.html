<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Sample Pharmacy (practice site)</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="login">
<div class="practice">Practice site for testing Khara Check. Not a real pharmacy. Nothing here is sold.</div>
<header><div class="bar">
  <a class="logo" href="/">Sample <span>Pharmacy</span></a>
</div></header>
<main>
  <h1>Log in</h1>
  <p class="lede">Enter your mobile number. This practice site accepts any code.</p>
  <form class="stack" id="login-form">
    <label>Mobile number <input type="tel" id="phone" name="phone" autocomplete="off" required></label>
    <label>Email (for order updates) <input type="email" id="email" name="email" autocomplete="off" required></label>
    <label>One-time code <input type="text" id="otp" name="otp" inputmode="numeric" autocomplete="off" value="000000" required></label>
    <button type="submit" id="login-button">Log in</button>
  </form>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
