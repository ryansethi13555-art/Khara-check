# Fleet demo: Practice Pharmacy A
name: "Practice Pharmacy A: search"
site:
  name: "Practice Pharmacy A"
  serve: ../../fixtures/site/first-party
network:
  mode: sandbox
  stubs: ../../fixtures/site/third-party

canaries:
  search: { type: search-term, base: metformin 500, label: medicine search }
steps:
  - goto: /?scenario=store
  - type: { into: "#q", text: "{{search}}" }
  - click: "#search-button"
  - waitFor: ".results"
settleMs: 400
